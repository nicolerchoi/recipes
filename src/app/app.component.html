<div class="flex flex-col h-screen bg-slate-50 text-slate-800 font-sans">
    <header
        data-testid="header"
        class="flex items-center justify-between px-6 h-16 bg-white border-b border-slate-200 shadow-xs z-10">
        <div routerLink="/" class="flex items-center space-x-2 cursor-pointer">
            <span class="text-xl font-bold tracking-tight bg-gradient-to-r from-emerald-600 to-teal-500 bg-clip-text text-transparent">
                SikFaanMei
            </span>
        </div>

        <div class="flex-1 max-w-xl mx-8">
            <div class="relative">
                <input
                    data-testid="header-search"
                    type="text" 
                    placeholder="Search recipes..." 
                    class="w-full pl-10 pr-4 py-2 bg-slate-100 border border-transparent rounded-lg focus:outline-hidden focus:bg-white focus:border-emerald-500 transition-all text-sm" />
                <span class="absolute left-3 top-2.5 text-slate-400 text-sm">🔍</span>
            </div>
        </div>

        <div class="flex items-center space-x-4">
            <button data-testid="login" class="flex items-center justify-center w-9 h-9 rounded-full bg-emerald-100 text-emerald-700 font-semibold text-sm border border-emerald-200 cursor-pointer hover:bg-emerald-200 transition-all">
                NC
            </button>
        </div>
    </header>

    <div class="flex flex-1 overflow-hidden">
        <aside
            data-testid="filter-panel"
            class="bg-white border-r border-slate-200 flex flex-col overflow-y-auto transition-all duration-300 ease-in-out shrink-0"
            [class.w-64]="!isLeftCollapsed"
            [class.w-16]="isLeftCollapsed">

            <div class="p-4 border-b border-slate-100 flex justify-between items-center bg-slate-50/50">
                @if (!isLeftCollapsed) {
                    <h2 class="font-semibold text-sm text-slate-500 uppercase tracking-wider">Filters</h2>
                }
                <button
                    data-testid="filter-panel-toggle"
                    class="text-xs text-slate-400 hover:text-slate-600"
                    (click)="isLeftCollapsed = !isLeftCollapsed">
                    <span class="material-symbols-outlined">chevron_{{ isLeftCollapsed ? 'forward' : 'backward' }}</span>
                </button>
            </div>

            @if (!isLeftCollapsed) {
                <div class="p-4 space-y-6">
                    <div>
                        <h3 class="font-medium text-sm mb-2 text-slate-700">Categories</h3>
                        <div class="space-y-2 text-sm text-slate-600">
                            <label class="flex items-center space-x-2"><input type="checkbox"> <span>Breakfast</span></label>
                            <label class="flex items-center space-x-2"><input type="checkbox"> <span>Lunch</span></label>
                            <label class="flex items-center space-x-2"><input type="checkbox"> <span>Dinner</span></label>
                        </div>
                    </div>
                </div>
            }
        </aside>

        <main data-testid="main-content" class="flex-1 bg-slate-50 overflow-y-auto">
            <router-outlet></router-outlet>
        </main>

        <aside
            data-testid="shopping-list-panel"
            class="bg-white border-l border-slate-200 flex flex-col overflow-y-auto transition-all duration-300 ease-in-out shrink-0"
            [class.w-64]="!isRightCollapsed"
            [class.w-16]="isRightCollapsed">

            <div class="p-4 border-b border-slate-100 flex justify-between items-center bg-slate-50/50">
                <button
                    data-testid="shopping-list-panel-toggle"
                    class="text-xs text-slate-400 hover:text-slate-600"
                    (click)="isRightCollapsed = !isRightCollapsed">
                    <span class="material-symbols-outlined">chevron_{{ isRightCollapsed ? 'backward' : 'forward' }}</span>
                </button>
                @if (!isRightCollapsed) {
                    <h2 class="font-semibold text-sm text-slate-500 uppercase tracking-wider">Shopping List</h2>
                }
            </div>
            @if (!isRightCollapsed) {
                <div class="p-4">
                    <p class="text-sm text-slate-400 text-center py-8">Your shopping list is empty.</p>
                </div>
            }
        </aside>
    </div>
</div>
