<div class="flex flex-col h-screen bg-slate-50 text-slate-800 font-sans">
    <header
        data-testid="header"
        class="flex items-center justify-between px-6 h-16 bg-white border-b border-slate-200 shadow-xs z-10">
        <div routerLink="/" class="flex items-center space-x-2 cursor-pointer">
            <span class="text-xl font-bold tracking-tight bg-gradient-to-r from-emerald-600 to-teal-500 bg-clip-text text-transparent">
                SikFaanMei
            </span>
        </div>

        <div class="flex-1 max-w-xl mx-8">
            <div class="relative">
                <input
                    data-testid="header-search"
                    type="text" 
                    placeholder="Search recipes..." 
                    class="w-full pl-10 pr-4 py-2 bg-slate-100 border border-transparent rounded-lg focus:outline-hidden focus:bg-white focus:border-emerald-500 transition-all text-sm" />
                <span class="absolute left-3 top-2.5 text-slate-400 text-sm">🔍</span>
            </div>
        </div>

        <div class="flex items-center space-x-4">
            @if (loginService.authSession()) {
                <button
                    (click)="logout()"
                    data-testid="login"
                    class="flex items-center justify-center w-9 h-9 rounded-full bg-emerald-100 text-emerald-700 font-semibold text-sm border border-emerald-200 cursor-pointer hover:bg-emerald-200 transition-all">
                    {{ loginService.getAdminInitials() | uppercase }}
                </button>
            } @else {
                <button 
                    routerLink="/login" 
                    title="Admin Sign In"
                    class="flex items-center justify-center w-9 h-9 rounded-full bg-slate-50 border border-slate-200 text-slate-400 cursor-pointer hover:text-slate-600 hover:bg-slate-100 hover:border-slate-300 transition-all">
                    <span class="material-symbols-outlined">person</span>
                </button>
            }
        </div>
    </header>

    <div class="flex flex-1 overflow-hidden">
        <main data-testid="main-content" class="flex-1 bg-slate-50 overflow-y-auto">
            <router-outlet></router-outlet>
        </main>
    </div>
</div>
